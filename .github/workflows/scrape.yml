# Run follower scrape (Playwright) on schedule or manually.
# Scraping runs here instead of Vercel so Chromium is available.

name: Scrape followers

on:
  schedule:
    # GitHub cron is UTC. Asia/Tbilisi = UTC+4 → subtract 4h for UTC.
    # 08:00 Tbilisi → 04:00 UTC
    - cron: "0 4 * * *"
    # 17:00 Tbilisi → 13:00 UTC
    - cron: "0 13 * * *"
    # 22:00 Tbilisi → 18:00 UTC
    - cron: "0 18 * * *"
  workflow_dispatch:
    # Allow manual run from Actions tab
  repository_dispatch:
    # Optional: trigger from Vercel API (see README)

env:
  NODE_ENV: production

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        # Keep devDependencies for ts-node and @types/* used by TypeScript scripts.
        run: npm ci --include=dev

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run scrape and save to DB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_TIMEZONE: ${{ vars.APP_TIMEZONE || 'UTC' }}
        run: npx ts-node --project tsconfig.scripts.json scripts/scrapeFollowers.ts
